name: Test Discord PR notifications

on:
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      # Ejecuta los tests existentes y el contrato de la acción en cada PR.
      - run: node --test tests/*.mjs tests/discord-pr-notifications/*.test.mjs
      - run: bash tests/scripts.test.sh
